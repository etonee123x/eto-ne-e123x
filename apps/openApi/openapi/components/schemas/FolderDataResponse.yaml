type: object
properties:
  folders:
    type: array
    items:
      allOf:
        - $ref: ./FolderDataItemFolder.yaml
        - type: object
          properties:
            path:
              type: string
          required:
            - path
  files:
    type: array
    items:
      allOf:
        - $ref: ./StoredFile.yaml
        - type: object
          properties:
            path:
              type: string
          required:
            - path
  file:
    oneOf:
      - allOf:
        - $ref: ./StoredFile.yaml
        - type: object
          properties:
            path:
              type: string
          required:
            - path
      - type: "null"
  pathDirectory:
    type: string
required:
  - folders
  - files
  - file
  - pathDirectory