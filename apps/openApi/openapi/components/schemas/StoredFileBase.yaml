type: object
properties:
  name:
    type: string
  size:
    type: integer
    minimum: 0
  _meta:
    type: object
    properties:
      createdAt:
        type: number
      updatedAt:
        type: number
    required:
      - createdAt
      - updatedAt
  itemType:
    allOf:
      - $ref: ./ItemType.yaml
      - enum:
        - FILE
  src:
    type: string
  extension:
    type:
      - string
      - "null"
required:
  - name
  - size
  - _meta
  - itemType
  - src
  - extension