name: CD Test

on:
  push:
    branches:
      - test
  workflow_dispatch:

concurrency:
  group: test-deploy
  cancel-in-progress: false

jobs:
  pre_deploy_checks:
    name: Pre-deploy checks (test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend install + checks
        working-directory: apps/backend
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: Frontend install + checks + build
        working-directory: apps/frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Contracts install + checks
        working-directory: apps/openApi
        run: |
          npm ci
          npm run lint
          npm run bundle

  deploy:
    name: Deploy to test server
    runs-on: ubuntu-latest
    needs: pre_deploy_checks
    env:
      DEPLOY_PATH: ${{ secrets.TEST_DEPLOY_PATH }}
      DEPLOY_BRANCH: ${{ secrets.TEST_DEPLOY_BRANCH }}
      FRONTEND_PM2_NAME: ${{ secrets.TEST_FRONTEND_PM2_NAME }}
      BACKEND_PM2_NAME: ${{ secrets.TEST_BACKEND_PM2_NAME }}
    steps:
      - name: Run test deployment over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          port: ${{ secrets.TEST_SERVER_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_PATH="${DEPLOY_PATH:-$HOME/apps/eto-ne-e123x-test}"
            DEPLOY_BRANCH="${DEPLOY_BRANCH:-test}"
            FRONTEND_PM2_NAME="${FRONTEND_PM2_NAME:-frontend-test}"
            BACKEND_PM2_NAME="${BACKEND_PM2_NAME:-backend-test}"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "Repository not found at $DEPLOY_PATH"
              echo "Clone it once on the server and rerun deployment."
              exit 1
            fi

            cd "$DEPLOY_PATH"

            git fetch --all --prune
            git checkout "$DEPLOY_BRANCH"
            git pull --ff-only origin "$DEPLOY_BRANCH"

            cd apps/openApi
            npm ci
            npm run lint
            npm run bundle

            cd ../backend
            npm ci
            npm run generate:openapi
            npm run typecheck

            cd ../frontend
            npm ci
            npm run generate:openapi
            npm run build

            pm2 restart "$BACKEND_PM2_NAME"
            pm2 restart "$FRONTEND_PM2_NAME"
            pm2 save
